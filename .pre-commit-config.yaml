repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: scan-for-secrets
        name: Scan for API keys and secrets
        entry: python scripts/scan_for_secrets.py
        language: python
        types: [text]
        exclude: >
          (?x)^(
            \.pre-commit-config\.yaml |
            scripts/scan_for_secrets\.py |
            tests/.* |
            docs/.* |
            \.gitignore |
            \.env\.template |
            pyproject\.toml
          )$
